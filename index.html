<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3161f">
<title>Vig's PTCG Collection</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PTCG">
<meta name="color-scheme" content="light">
<style>
  :root{
    --red:#b3161f; --red-dk:#8f0f17; --blue:#2a5fb3; --gold:#e8b23a;
    --bg:#f4f5f7; --card:#ffffff; --ink:#1a1c20; --muted:#6b7280;
    --line:#e6e8ec; --chip:#eef1f6; --chip-ink:#41485a; --dark:#1a1c20;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --head-h:60px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.4;
    padding-bottom:calc(120px + var(--safe-b));
  }
  a{color:inherit}

  /* ---- Header ---- */
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,var(--red),var(--red-dk));
    color:#fff; padding:calc(12px + var(--safe-t)) 16px 12px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .brand{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .brand .title{font-weight:800; font-size:1.15rem; letter-spacing:.2px}
  .pokeball{width:22px;height:22px;flex:0 0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
  .updated{font-size:.72rem; opacity:.85; font-weight:600; margin-left:auto; white-space:nowrap}

  /* ---- Search (pinned under header; used by Search + Needs tabs) ---- */
  .searchwrap{position:sticky; top:var(--head-h); z-index:15; background:var(--bg); padding:12px 16px 8px}
  .searchwrap.hide{display:none}
  .search{position:relative}
  .search input{
    width:100%; font-size:1.05rem; padding:14px 44px 14px 44px; border-radius:14px;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink);
    box-shadow:var(--shadow); -webkit-appearance:none;
  }
  .search input:focus{outline:none; border-color:var(--red)}
  .search .ico{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:1.1rem}
  .search .clr{position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:var(--chip);
    color:var(--chip-ink); width:30px; height:30px; border-radius:50%; font-size:1rem; cursor:pointer; display:none}
  .search.has .clr{display:block}

  main{padding:0 14px}

  /* ---- Collapsible stats (Collection tab only) — coloured + pinned ---- */
  .statsbox{position:sticky; top:var(--head-h); z-index:14; background:#e9f0fb; border:1px solid #cbddf6;
    border-radius:16px; box-shadow:var(--shadow); margin:12px 0 6px; overflow:hidden}
  .statstoggle{width:100%; border:0; background:var(--blue); color:#fff; font:inherit; font-weight:700; font-size:.95rem;
    display:flex; align-items:center; gap:8px; padding:13px 14px; cursor:pointer}
  .statstoggle .chev{margin-left:auto; transition:transform .2s}
  .statsbox.open .statstoggle .chev{transform:rotate(90deg)}
  .statsgrid{display:none; grid-template-columns:repeat(2,1fr); gap:8px; padding:10px 12px 12px}
  .statsbox.open .statsgrid{display:grid}
  .stat{background:#fff; border-radius:12px; padding:10px 8px; text-align:center}
  .stat b{display:block; font-size:1.3rem; font-weight:800; line-height:1.1; color:var(--red)}
  .stat span{display:block; font-size:.64rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-top:2px}

  /* ---- Group card (collapsed by default, tap header to expand) ---- */
  .group{background:var(--card); border:1px solid var(--line); border-radius:16px; margin:10px 0; box-shadow:var(--shadow); overflow:hidden}
  .ghead{display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; user-select:none}
  .gmeta{flex:1; min-width:0}
  .gname{font-weight:700; font-size:1.02rem}
  .gsub{font-size:.74rem; color:var(--muted); margin-top:2px}
  .gtotal{flex:0 0 auto; text-align:center; background:var(--red); color:#fff; border-radius:11px; padding:5px 11px; min-width:52px}
  .gtotal.one{background:var(--blue)}
  .gtotal b{display:block; font-size:1.15rem; font-weight:800; line-height:1}
  .gtotal span{display:block; font-size:.55rem; text-transform:uppercase; letter-spacing:.5px; opacity:.9}
  .gchev{flex:0 0 auto; color:var(--muted); font-size:1rem; transition:transform .2s}
  .group.open .gchev{transform:rotate(90deg)}
  .variants{display:none; border-top:1px solid var(--line)}
  .group.open .variants{display:block}
  .vrow{display:flex; align-items:center; gap:10px; padding:9px 14px; border-top:1px solid var(--line)}
  .vrow:first-child{border-top:0}
  .vqty{flex:0 0 auto; width:38px; height:38px; border-radius:10px; background:var(--chip); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.02rem}
  .vmeta{flex:1; min-width:0}
  .vname{font-size:.92rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .vsub{display:flex; gap:8px; align-items:center; margin-top:2px; flex-wrap:wrap}
  .chip{font-size:.68rem; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--chip-ink); font-weight:600}
  .chip.std{background:transparent; color:var(--muted); padding-left:0}
  .vcost{font-size:.72rem; color:var(--muted)}

  /* ---- Needs + on-the-go capture ---- */
  .capbox{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:12px 14px; margin:12px 0 4px}
  .caphdr{font-weight:700; font-size:.95rem; margin-bottom:10px}
  .caprow{display:flex; gap:10px; align-items:center}
  .stepper{display:flex; align-items:center; border:1.5px solid var(--line); border-radius:12px; overflow:hidden; flex:0 0 auto}
  .stepper button{width:38px; height:44px; border:0; background:var(--chip); color:var(--ink); font-size:1.3rem; font-weight:700; cursor:pointer; line-height:1}
  .stepper button:active{background:#e2e6ee}
  .stepper span{min-width:36px; text-align:center; font-weight:800; font-size:1.05rem}
  #capName{flex:1; min-width:0; height:44px; padding:0 12px; border:1.5px solid var(--line); border-radius:12px; font-size:1rem; background:var(--card); color:var(--ink); -webkit-appearance:none}
  #capName:focus{outline:none; border-color:var(--red)}
  .capadd{width:100%; margin-top:10px; height:46px; border:0; border-radius:12px; background:var(--red); color:#fff; font-size:1rem; font-weight:700; cursor:pointer}
  .capadd:active{background:var(--red-dk)}

  .pendhdr,.needhdr{font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; padding:12px 4px 6px}
  .needhdr{color:var(--muted)}
  .pendhdr{color:#9a7b12}
  .emptymini{color:var(--muted); padding:8px 4px 4px; font-size:.9rem}
  .needrow{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; margin:8px 0; box-shadow:var(--shadow)}
  .needrow.pend{border-left:4px solid var(--gold)}
  .needqty{flex:0 0 auto; width:40px; height:40px; border-radius:11px; background:var(--gold); color:#3a2c00;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.05rem}
  .needname{font-weight:600; flex:1; min-width:0}
  .pnote{font-size:.74rem; color:var(--muted); font-weight:500; margin-top:2px}
  .pdel{flex:0 0 auto; width:32px; height:32px; border-radius:50%; border:0; background:var(--chip); color:var(--muted); font-size:.85rem; cursor:pointer}
  .pendactions{display:flex; gap:10px; margin:12px 0 4px}
  .pbtn{height:44px; border:0; border-radius:12px; font-size:.9rem; font-weight:700; cursor:pointer}
  .pbtn.copy{flex:1; background:var(--blue); color:#fff}
  .pbtn.clear{flex:0 0 auto; padding:0 16px; background:var(--chip); color:var(--chip-ink)}

  /* ---- Deck import ---- */
  .impsum{padding:11px 14px; border-radius:12px; font-weight:700; font-size:.9rem; margin:6px 0 10px}
  .impsum.ok{background:#e7f4ea; color:#1c6b34}
  .impsum.miss{background:#fdeceb; color:#a62622}
  .impadd{width:100%; margin:0 0 14px; height:46px; border:0; border-radius:12px; background:var(--red); color:#fff; font-size:1rem; font-weight:700; cursor:pointer}
  .deckhdr{color:var(--muted); font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; padding:12px 4px 4px}
  .deckrow{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin:6px 0; box-shadow:var(--shadow)}
  .deckrow.short{border-left:4px solid var(--red)}
  .deckrow.ok{opacity:.66}
  .deckrow.basic{opacity:.55}
  .dq{flex:0 0 auto; min-width:28px; height:30px; padding:0 7px; border-radius:8px; background:var(--chip); color:var(--ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.9rem}
  .dn{flex:1; min-width:0; font-weight:600; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dstat{flex:0 0 auto; font-size:.73rem; font-weight:700; text-align:right}
  .dstat.ok{color:#1c6b34}
  .dstat.short{color:var(--red)}
  .dstat.basic{color:var(--muted)}
  .impsub2{color:var(--muted); font-size:.78rem; margin:-8px 0 8px; padding:0 2px}
  .dninfo{flex:1; min-width:0}
  .dninfo .dn{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dsub{font-size:.72rem; color:var(--red); font-weight:700; margin-top:1px}
  .deckadd{flex:0 0 auto; border:0; background:var(--red); color:#fff; font-size:.75rem; font-weight:700; padding:8px 12px; border-radius:999px; cursor:pointer}
  .deckadd.added{background:var(--muted)}
  .jpswitch{display:inline-flex; align-items:center; gap:11px; padding:12px 4px 6px; cursor:pointer; user-select:none}
  .jpswitch .flag{font-size:1.55rem; line-height:1}
  .jpswitch input{position:absolute; opacity:0; width:0; height:0}
  .jpswitch .slider{position:relative; width:52px; height:30px; background:#b9bcc2; border-radius:999px; transition:background .2s; flex:0 0 auto}
  .jpswitch .slider::before{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .2s}
  .jpswitch input:checked + .slider{background:var(--red)}
  .jpswitch input:checked + .slider::before{transform:translateX(22px)}
  .jpswitch .vicon{width:26px; height:26px; object-fit:contain; display:block}
  .verswitches{display:flex; align-items:center; gap:22px; flex-wrap:wrap}
  .proxytag{background:#40434a}
  .jphint{background:#eef3fb; color:#2a4a86; border-radius:12px; padding:9px 13px; font-size:.8rem; font-weight:600; margin:0 0 10px}
  .jp{display:inline-block; font-size:.58rem; font-weight:800; background:#c0392b; color:#fff; padding:1px 5px; border-radius:4px; margin-left:6px; vertical-align:middle; letter-spacing:.4px}
  .gcostline{border-top:1px solid var(--line); padding:8px 14px; font-size:.72rem; color:var(--muted); font-weight:600}
  .vset{font-size:.72rem; color:var(--muted); font-weight:600; margin-left:6px}

  /* ---- Notes ---- */
  #noteInput{width:100%; min-height:96px; resize:vertical; padding:12px; border:1.5px solid var(--line); border-radius:12px;
    font-size:1rem; font-family:inherit; line-height:1.4; background:var(--card); color:var(--ink); -webkit-appearance:none; margin-bottom:10px}
  #noteInput:focus{outline:none; border-color:var(--red)}
  .notecard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:10px 0; box-shadow:var(--shadow)}
  .notetext{white-space:pre-wrap; overflow-wrap:anywhere; font-size:.95rem; line-height:1.45}
  .noterow{display:flex; align-items:center; margin-top:10px; gap:10px}
  .notedate{font-size:.72rem; color:var(--muted); font-weight:600}
  .ndel{margin-left:auto; border:0; background:var(--chip); color:var(--chip-ink); font-size:.75rem; font-weight:700; padding:6px 12px; border-radius:999px; cursor:pointer}

  #toast{position:fixed; left:50%; bottom:calc(80px + var(--safe-b)); transform:translateX(-50%) translateY(16px);
    background:var(--dark); color:#fff; padding:10px 16px; border-radius:12px; font-size:.85rem; font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:30; max-width:88%; text-align:center}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  .empty{text-align:center; color:var(--muted); padding:56px 24px; font-size:1rem}
  .empty .big{font-size:2.2rem; display:block; margin-bottom:10px}
  .empty .bigimg{width:54px; height:54px; object-fit:contain; display:block; margin:0 auto 12px}
  .sechint{color:var(--muted); font-size:.74rem; padding:6px 4px 8px; font-weight:600; text-transform:uppercase; letter-spacing:.5px}

  /* ---- Result footer (live totals) ---- */
  .resbar{position:fixed; left:0; right:0; bottom:calc(56px + var(--safe-b)); z-index:12;
    display:flex; justify-content:center; padding:0 14px; pointer-events:none}
  .resbar.hidden{display:none}
  .resbar .inner{pointer-events:auto; background:var(--dark); color:#fff; border-radius:12px;
    padding:8px 14px; font-size:.82rem; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.25);
    display:flex; gap:14px; align-items:center; max-width:640px; width:100%; justify-content:space-between}
  .resbar b{color:var(--gold)}

  /* ---- Bottom tab bar ---- */
  nav{position:fixed; left:0; right:0; bottom:0; z-index:18; display:flex; background:var(--card);
    border-top:1px solid var(--line); padding-bottom:max(4px, calc(env(safe-area-inset-bottom, 0px) - 16px))}
  nav button{flex:1; border:0; background:none; color:var(--muted); padding:8px 0 6px; font:inherit;
    display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; font-size:.7rem; font-weight:600; position:relative}
  nav button .tico{width:26px; height:26px; object-fit:contain; display:block}
  nav button.active{color:var(--red)}
  nav .badge{position:absolute; top:2px; left:50%; margin-left:8px; background:var(--gold); color:#3a2c00;
    border-radius:999px; font-size:.6rem; padding:1px 5px; font-weight:800}

  .view{display:none}
  .view.active{display:block}
  @media(min-width:640px){ main,.searchwrap,header{max-width:680px;margin-left:auto;margin-right:auto} }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="pokeball" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#111" stroke-width="6"/><path d="M5 50a45 45 0 0190 0z" fill="#e33"/><line x1="5" y1="50" x2="34" y2="50" stroke="#111" stroke-width="6"/><line x1="66" y1="50" x2="95" y2="50" stroke="#111" stroke-width="6"/><circle cx="50" cy="50" r="14" fill="#fff" stroke="#111" stroke-width="6"/></svg>
    <span class="title">Vig's PTCG Collection</span>
    <span class="updated" id="updated"></span>
  </div>
</header>

<div class="searchwrap" id="searchwrap">
  <div class="search" id="searchbox">
    <span class="ico">🔍</span>
    <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="none"
           enterkeyhint="search" placeholder="Search cards…" aria-label="Search cards">
    <button class="clr" id="clr" aria-label="Clear">✕</button>
  </div>
</div>

<main>
  <section class="view active" id="view-search"></section>
  <section class="view" id="view-collection"></section>
  <section class="view" id="view-needs"></section>
  <section class="view" id="view-import"></section>
  <section class="view" id="view-notes"></section>
</main>

<div class="resbar hidden" id="resbar"><div class="inner"><span id="resCount"></span><span id="resAvg"></span></div></div>

<nav>
  <button id="tab-search" class="active"><img class="tico" src="icons/tab-search.png" alt="">Search</button>
  <button id="tab-collection"><img class="tico" src="icons/tab-collection.png" alt="">Collection</button>
  <button id="tab-needs"><img class="tico" src="icons/tab-needs.png" alt="">Needs</button>
  <button id="tab-import"><img class="tico" src="icons/tab-import.png" alt="">Import</button>
  <button id="tab-notes"><img class="tico" src="icons/tab-notes.png" alt="">Notes</button>
</nav>

<script>
const $ = s => document.querySelector(s);
const money = n => "$" + n.toFixed(2);
let DATA = null, TAB = "search", statsOpen = false;
let pending = [], pendingQty = 1;              // on-the-go captured needs (populated from localStorage in init)
let importMissing = [], deckText = "", importJp = false, importProxy = false;   // deck-import toggles (count Japanese / Proxy prints?)
let notes = [];                                // local notes / ideas (populated in init)

const norm = s => (s||"").toLowerCase();

function fmtDate(iso){                       // "2026-08-02" -> "02-08-26"
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");
  return m ? `${m[3]}-${m[2]}-${m[1].slice(2)}` : iso;
}

function setHeadH(){ document.documentElement.style.setProperty("--head-h", $("header").offsetHeight + "px"); }

function groupMatches(g, q){ return q ? norm(g.base).includes(q) : false; }

function setNumOf(v){ return v.set ? (v.num ? `${v.set} ${v.num}` : v.set) : ""; }

function groupHTML(g){
  const many = g.variants.length > 1, v0 = g.variants[0];
  const sub = many ? `${g.variants.length} versions`
            : (v0.version !== "Standard" ? v0.version : (g.avgCost != null ? `${money(g.avgCost)} each` : "Standard"));
  const rows = g.variants.map(v => {
    const sn = setNumOf(v), snHtml = sn ? ` <span class="vset">${sn}</span>` : "";
    return `
    <div class="vrow">
      <div class="vqty">${v.qty}</div>
      <div class="vmeta"><div class="vname">${v.version}${v.jp ? ' <span class="jp">JP</span>' : ''}${v.proxy ? ' <span class="jp proxytag">PROXY</span>' : ''}${snHtml}</div></div>
    </div>`;
  }).join("");
  const costline = g.avgCost != null
    ? `<div class="gcostline">Avg ${money(g.avgCost)}/card · ${money(g.spent)} spent</div>` : "";
  return `
    <div class="group">
      <div class="ghead">
        <div class="gmeta"><div class="gname">${g.base}</div><div class="gsub">${sub}</div></div>
        <div class="gtotal ${many?'':'one'}"><b>${g.total}</b><span>have</span></div>
        <span class="gchev">▸</span>
      </div>
      <div class="variants">${rows}${costline}</div>
    </div>`;
}

function tally(groups){
  let cards = 0, spent = 0, pqty = 0;
  groups.forEach(g => { cards += g.total; if(g.spent != null){ spent += g.spent; pqty += g.pqty; } });
  return { cards, avg: pqty ? spent/pqty : 0, hasAvg: pqty > 0 };
}

function updateResbar(cards, avg, show, label, hasAvg){
  const bar = $("#resbar");
  if(!show){ bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  $("#resCount").innerHTML = `${label}: <b>${cards}</b> card${cards!==1?'s':''}`;
  $("#resAvg").innerHTML = hasAvg ? `Avg <b>${money(avg)}</b>/card` : "";
}

/* ---- Search tab ---- */
function renderSearch(){
  const raw = $("#q").value.trim(), q = norm(raw);
  const view = $("#view-search");
  if(!q){
    view.innerHTML = `<div class="empty"><img class="bigimg" src="icons/tab-search.png" alt="">Search your collection —<br>start typing a card name.</div>`;
    updateResbar(0,0,false); return;
  }
  const matched = DATA.groups.filter(g => groupMatches(g, q));
  if(matched.length === 0){
    view.innerHTML = `<div class="empty"><span class="big">🔍</span>No cards match “${raw}”.</div>`;
    updateResbar(0,0,false); return;
  }
  view.innerHTML = `<div class="sechint">${matched.length} name${matched.length!==1?'s':''} matched</div>` + matched.map(groupHTML).join("");
  const t = tally(matched);
  updateResbar(t.cards, t.avg, true, "Result", t.hasAvg);
}

/* ---- Collection tab (full browse + expandable stats) ---- */
function renderCollection(){
  const s = DATA.stats;
  const statHTML = [
    [s.ownedCopies, "Owned"], [s.ownedNames, "Names"],
    [s.ownedEntries, "Versions"], [money(s.totalSpent), "Spent"],
  ].map(([v,l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

  $("#view-collection").innerHTML =
    `<div class="statsbox ${statsOpen?'open':''}" id="statsbox">
       <button class="statstoggle" id="statstoggle">📊 Collection stats <span class="chev">▸</span></button>
       <div class="statsgrid">${statHTML}</div>
     </div>` +
    DATA.groups.map(groupHTML).join("");

  const t = tally(DATA.groups);
  updateResbar(t.cards, t.avg, true, "Total", t.hasAvg);
}

/* ---- On-the-go needs capture (stored locally on this device) ---- */
const PKEY = "ptcg_pending_needs";
function loadPending(){ try{ return JSON.parse(localStorage.getItem(PKEY)) || []; }catch(e){ return []; } }
function savePending(){ try{ localStorage.setItem(PKEY, JSON.stringify(pending)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg){
  let t = $("#toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2000);
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
    }catch(e2){ return false; }
  }
}

function updateNeedsBadge(){
  const n = (DATA ? DATA.needs.length : 0) + pending.length;
  const btn = $("#tab-needs");
  let b = btn.querySelector(".badge");
  if(n > 0){ if(!b){ b = document.createElement("span"); b.className = "badge"; btn.appendChild(b); } b.textContent = n; }
  else if(b){ b.remove(); }
}

function capture(){
  const el = $("#capName");
  if(!el) return;
  const name = (el.value || "").trim();
  if(!name){ toast("Enter a card name"); el.focus(); return; }
  pending.unshift({ qty: pendingQty, name });
  savePending();
  pendingQty = 1; $("#capQty").textContent = "1";
  el.value = "";
  renderPending(); updateNeedsBadge();
  el.focus();
  toast("Captured");
}

async function copyPending(){
  if(!pending.length){ toast("Nothing to copy yet"); return; }
  const tsv = pending.map(p => `${p.qty}\t${p.name}`).join("\n");   // qty <TAB> name → separate cells on paste
  const ok = await copyText(tsv);
  if(ok) toast(`Copied ${pending.length} row${pending.length!==1?'s':''} — paste into the Needs sheet`);
  else window.prompt("Copy these rows, then paste into the Needs sheet:", tsv);
}

function renderPending(){
  const el = $("#pendingSection");
  if(!el) return;
  if(!pending.length){ el.innerHTML = ""; return; }
  const total = pending.reduce((a,p) => a + (+p.qty || 0), 0);
  el.innerHTML =
    `<div class="pendhdr">📍 Captured on the go · ${total} card${total!==1?'s':''}</div>` +
    pending.map((p,i) => `
      <div class="needrow pend">
        <div class="needqty">${p.qty}</div>
        <div class="needname">${esc(p.name)}</div>
        <button class="pdel" data-del="${i}" aria-label="Remove">✕</button>
      </div>`).join("") +
    `<div class="pendactions">
       <button id="pendCopy" class="pbtn copy">📋 Copy for spreadsheet</button>
       <button id="pendErase" class="pbtn clear">Erase</button>
     </div>`;
}

/* ---- Copy ALL needs (captured + spreadsheet), human-readable "2x Name" ---- */
async function copyAllNeeds(){
  const map = new Map();
  const add = (qty, name) => { const k = dkey(name); if(map.has(k)) map.get(k).qty += qty; else map.set(k, { qty, name }); };
  pending.forEach(p => add(+p.qty || 0, p.name));
  DATA.needs.forEach(n => add(+n.qty || 0, n.name));
  const list = [...map.values()].filter(x => x.qty > 0).sort((a,b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
  if(!list.length){ toast("No needs to copy"); return; }
  const text = list.map(x => `${x.qty}x ${x.name}`).join("\n");
  const ok = await copyText(text);
  if(ok) toast(`Copied ${list.length} need${list.length!==1?'s':''}`);
  else window.prompt("Copy your needs list:", text);
}

/* ---- Deck import (paste a deck list, check against collection) ---- */
const DKEY = "ptcg_deck";
function loadDeck(){ try{ return localStorage.getItem(DKEY) || ""; }catch(e){ return ""; } }
function saveDeck(){ try{ localStorage.setItem(DKEY, deckText); }catch(e){} }
function loadImportJp(){ try{ return localStorage.getItem("ptcg_import_jp") === "1"; }catch(e){ return false; } }
function saveImportJp(){ try{ localStorage.setItem("ptcg_import_jp", importJp ? "1" : "0"); }catch(e){} }
function loadImportProxy(){ try{ return localStorage.getItem("ptcg_import_proxy") === "1"; }catch(e){ return false; } }
function saveImportProxy(){ try{ localStorage.setItem("ptcg_import_proxy", importProxy ? "1" : "0"); }catch(e){} }
// normalise a card name for matching: lowercase, strip accents, unify apostrophes, collapse spaces
function dkey(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’'`´]/g,"'").replace(/\s+/g," ").trim(); }

const BASIC_ENERGY = new Set(["grass energy","fire energy","water energy","lightning energy","psychic energy","fighting energy","darkness energy","metal energy","fairy energy"]);
function isBasicEnergy(name){ const k = dkey(name); return BASIC_ENERGY.has(k) || /^basic .+ energy$/.test(k); }

function parseDeck(text){
  const cards = [];
  let section = "Other";
  for(const raw of String(text).split(/\r?\n/)){
    const line = raw.trim();
    if(!line) continue;
    if(!/^\d/.test(line)){                        // section header or noise line
      const h = /^(pok[eé]mon|trainer|energy)\b/i.exec(line);
      if(h){ const w = h[1].toLowerCase(); section = w.startsWith("pok") ? "Pokémon" : w.startsWith("tra") ? "Trainer" : "Energy"; }
      continue;
    }
    const m = /^(\d+)\s*[xX]?\s+(.+)$/.exec(line); // "4 Name SET 97" / "4x Name SET 97"
    if(!m) continue;
    const count = parseInt(m[1], 10);
    let toks = m[2].trim().split(/\s+/);
    if(toks.length >= 3){                          // strip trailing "SET number" (uppercase code + numeric collector)
      const last = toks[toks.length-1], prev = toks[toks.length-2];
      if(/\d/.test(last) && !/[a-z]/.test(last) && /^[A-Z0-9]{2,5}$/.test(prev)) toks = toks.slice(0, -2);
    }
    const name = toks.join(" ").trim();
    if(count > 0 && name) cards.push({ count, name, section });
  }
  return cards;
}

function renderImportResults(){
  const el = $("#importResults"); if(!el) return;
  const cards = parseDeck(deckText);
  if(!cards.length){
    importMissing = [];
    el.innerHTML = `<div class="emptymini">Copy a deck list, then tap “Import from clipboard”.</div>`;
    return;
  }
  const idx = new Map();
  DATA.groups.forEach(g => idx.set(dkey(g.base), g));   // base name → owned group

  const buckets = {};
  let missCards = 0, missLines = 0, jpExcl = false, proxyExcl = false;
  importMissing = [];
  cards.forEach(c => {
    const basic = c.section === "Energy" && isBasicEnergy(c.name);
    let have = 0, status = "ok", miss = 0;
    if(basic){ status = "basic"; }
    else {
      const g = idx.get(dkey(c.name));
      let jpQ = 0, proxyQ = 0;
      if(g) for(const v of g.variants){
        const excluded = (v.jp && !importJp) || (v.proxy && !importProxy);
        if(!excluded) have += v.qty;
        if(v.jp) jpQ += v.qty;
        if(v.proxy) proxyQ += v.qty;
      }
      miss = Math.max(0, c.count - have);
      if(miss > 0){
        status = "short"; missCards += miss; missLines++;
        c._mi = importMissing.length; importMissing.push({ qty: miss, name: c.name });
        if(!importJp && jpQ > 0) jpExcl = true;
        if(!importProxy && proxyQ > 0) proxyExcl = true;
      }
    }
    (buckets[c.section] = buckets[c.section] || []).push({ ...c, have, status });
  });

  let html = missCards === 0
    ? `<div class="impsum ok">✅ You have every card in this deck.</div>`
    : `<div class="impsum miss">⚠️ Missing ${missCards} card${missCards!==1?'s':''} across ${missLines} line${missLines!==1?'s':''}.</div>`;
  if(jpExcl)
    html += `<div class="jphint">🇯🇵 You own Japanese copies of some missing cards.</div>`;
  if(proxyExcl)
    html += `<div class="jphint">You have proxies of some missing cards.</div>`;
  if(importMissing.length)
    html += `<button id="importAddNeeds" class="impadd">➕ Add all ${missCards} missing to Needs</button>
             <div class="impsub2">…or tap “+ Needs” on any card below to add just that one.</div>`;

  ["Pokémon","Trainer","Energy","Other"].forEach(sec => {
    const list = buckets[sec]; if(!list || !list.length) return;
    html += `<div class="deckhdr">${sec}</div>` + list.map(c => {
      if(c.status === "short"){
        return `<div class="deckrow short">
          <span class="dq">${c.count}</span>
          <div class="dninfo"><div class="dn">${esc(c.name)}</div><div class="dsub">need ${c.count} · have ${c.have}</div></div>
          <button class="deckadd" data-mi="${c._mi}">+ Needs</button>
        </div>`;
      }
      const stat = c.status === "basic" ? "basic · assumed in stock" : `✓ have ${c.have}`;
      return `<div class="deckrow ${c.status}"><span class="dq">${c.count}</span><span class="dn">${esc(c.name)}</span><span class="dstat ${c.status}">${stat}</span></div>`;
    }).join("");
  });
  el.innerHTML = html;
}

async function importFromClipboard(){
  let text = null;
  try{ text = await navigator.clipboard.readText(); }
  catch(e){ text = null; }
  if(text == null) text = window.prompt("Paste your deck list here:") || "";   // fallback if clipboard read is blocked
  text = text.trim();
  if(!text){ toast("Clipboard was empty"); return; }
  deckText = text; saveDeck(); renderImport();
  toast("Deck imported");
}

/* ---- Notes (local ideas / thoughts, this device only) ---- */
const NKEY = "ptcg_notes";
function loadNotes(){ try{ return JSON.parse(localStorage.getItem(NKEY)) || []; }catch(e){ return []; } }
function saveNotes(){ try{ localStorage.setItem(NKEY, JSON.stringify(notes)); }catch(e){} }
function noteDate(ts){
  const d = new Date(ts); if(isNaN(d)) return "";
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) + " · " +
         d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function addNote(){
  const el = $("#noteInput"); if(!el) return;
  const text = (el.value || "").trim();
  if(!text){ toast("Write something first"); el.focus(); return; }
  notes.unshift({ text, ts: Date.now() });
  saveNotes(); el.value = ""; renderNotesList(); el.focus();
  toast("Note saved");
}
function renderNotesList(){
  const el = $("#notesList"); if(!el) return;
  if(!notes.length){ el.innerHTML = `<div class="emptymini">No notes yet — jot your first idea above.</div>`; return; }
  el.innerHTML = `<div class="sechint">${notes.length} note${notes.length!==1?'s':''}</div>` +
    notes.map((n,i) => `
      <div class="notecard">
        <div class="notetext">${esc(n.text)}</div>
        <div class="noterow"><span class="notedate">${noteDate(n.ts)}</span><button class="ndel" data-ndel="${i}">🗑 Scrap</button></div>
      </div>`).join("");
}
function renderNotes(){
  updateResbar(0,0,false);
  $("#view-notes").innerHTML =
    `<div class="capbox">
       <div class="caphdr">✍️ New note</div>
       <textarea id="noteInput"></textarea>
       <button id="noteAdd" class="capadd">Add note</button>
     </div>
     <div id="notesList"></div>`;
  renderNotesList();
}

function renderImport(){
  updateResbar(0,0,false);
  const hasDeck = !!deckText.trim();
  $("#view-import").innerHTML =
    `<div class="caphdr" style="margin-top:14px">🧩 Deck check</div>
     <div class="pendactions" style="margin-top:10px">
       <button id="deckImport" class="pbtn copy" style="flex:1">📋 Import from clipboard</button>
       ${hasDeck ? `<button id="deckErase" class="pbtn clear">Erase</button>` : ``}
     </div>
     <div class="verswitches">
       <label class="jpswitch" aria-label="Include Japanese prints"><span class="flag">🇯🇵</span><input type="checkbox" id="jpToggle" ${importJp?'checked':''}><span class="slider"></span></label>
       <label class="jpswitch" aria-label="Include proxies"><img class="vicon" src="icons/proxy.svg" alt=""><input type="checkbox" id="proxyToggle" ${importProxy?'checked':''}><span class="slider"></span></label>
     </div>
     <div id="importResults"></div>`;
  renderImportResults();
}

/* ---- Needs tab (spreadsheet needs + local on-the-go capture) ---- */
function renderNeeds(){
  updateResbar(0,0,false);
  pendingQty = 1;
  const off = DATA.needs;
  const offTotal = off.reduce((a,n) => a + n.qty, 0);
  const offHTML = off.length
    ? `<div class="needhdr">📋 From spreadsheet · ${offTotal} card${offTotal!==1?'s':''} · ${off.length} name${off.length!==1?'s':''}</div>` +
      off.map(n => `<div class="needrow"><div class="needqty">${n.qty}</div><div class="needname">${esc(n.name)}</div></div>`).join("")
    : `<div class="needhdr">📋 From spreadsheet</div><div class="emptymini">Nothing on the needs list yet.</div>`;

  $("#view-needs").innerHTML =
    `<div class="capbox">
       <div class="caphdr">➕ Capture a needed card</div>
       <div class="caprow">
         <div class="stepper"><button data-step="-1" aria-label="Less">−</button><span id="capQty">1</span><button data-step="1" aria-label="More">+</button></div>
         <input id="capName" type="text" autocomplete="off" autocapitalize="words" enterkeyhint="done" placeholder="Card name">
       </div>
       <button id="capBtn" class="capadd">Capture</button>
     </div>
     <div id="pendingSection"></div>
     ${offHTML}
     <div class="pendactions" style="margin-top:18px">
       <button id="copyAllNeeds" class="pbtn copy" style="flex:1">📋 Copy all needs (captured + spreadsheet)</button>
     </div>`;
  renderPending();
}

function render(){
  if(TAB === "search") renderSearch();
  else if(TAB === "collection") renderCollection();
  else if(TAB === "import") renderImport();
  else if(TAB === "notes") renderNotes();
  else renderNeeds();
}

function setTab(t){
  TAB = t;
  $("#q").value = "";
  $("#searchbox").classList.remove("has");
  ["search","collection","needs","import","notes"].forEach(k => {
    $("#tab-"+k).classList.toggle("active", k===t);
    $("#view-"+k).classList.toggle("active", k===t);
  });
  $("#searchwrap").classList.toggle("hide", t !== "search");   // search box only on the Search tab
  window.scrollTo(0,0);
  render();
  if(t === "search") focusSearch();                        // open keyboard on mobile (tap gesture)
}

function focusSearch(){
  const el = $("#q");
  el.focus({preventScroll:true});
  try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
}

function onSearch(){
  $("#searchbox").classList.toggle("has", $("#q").value.length>0);
  render();
}

async function init(){
  setHeadH();
  try{
    const res = await fetch("data/collection.json?v=" + Date.now());
    DATA = await res.json();
  }catch(e){
    $("#view-search").innerHTML = `<div class="empty"><span class="big">⚠️</span>Couldn’t load collection data.<br><small>${e}</small></div>`;
    return;
  }
  $("#updated").textContent = "Updated " + fmtDate(DATA.updated);
  pending = loadPending();     // load AFTER PKEY is initialised — fixes captures lost on reopen
  deckText = loadDeck();
  importJp = loadImportJp();
  importProxy = loadImportProxy();
  notes = loadNotes();
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist();  // ask iOS not to evict
  updateNeedsBadge();
  // delegated clicks
  $("main").addEventListener("click", e => {
    if(e.target.closest("#deckImport")){ importFromClipboard(); return; }
    if(e.target.closest("#deckErase")){ deckText = ""; saveDeck(); renderImport(); return; }
    if(e.target.closest("#noteAdd")){ addNote(); return; }
    const nd = e.target.closest("[data-ndel]");
    if(nd){ if(confirm("Scrap this note?")){ notes.splice(+nd.dataset.ndel, 1); saveNotes(); renderNotesList(); } return; }
    if(e.target.closest("#copyAllNeeds")){ copyAllNeeds(); return; }
    const dadd = e.target.closest(".deckadd");
    if(dadd){
      const m = importMissing[+dadd.dataset.mi];
      if(m){
        const k = dkey(m.name), i = pending.findIndex(p => dkey(p.name) === k);
        if(i >= 0) pending[i].qty = m.qty; else pending.unshift({ qty: m.qty, name: m.name });
        savePending(); updateNeedsBadge();
        dadd.textContent = "✓ Added"; dadd.classList.add("added"); dadd.disabled = true;
        toast(`Added ${m.name} to Needs`);
      }
      return;
    }
    if(e.target.closest("#importAddNeeds")){
      importMissing.forEach(m => {
        const k = dkey(m.name), i = pending.findIndex(p => dkey(p.name) === k);
        if(i >= 0) pending[i].qty = m.qty; else pending.unshift({ qty: m.qty, name: m.name });
      });
      savePending(); updateNeedsBadge();
      toast(`Added ${importMissing.length} card${importMissing.length!==1?'s':''} to Needs`);
      setTab("needs");
      return;
    }
    // on-the-go capture controls
    const step = e.target.closest("[data-step]");
    if(step){ pendingQty = Math.max(1, pendingQty + (+step.dataset.step)); const q = $("#capQty"); if(q) q.textContent = pendingQty; return; }
    if(e.target.closest("#capBtn")){ capture(); return; }
    const del = e.target.closest("[data-del]");
    if(del){ pending.splice(+del.dataset.del, 1); savePending(); renderPending(); updateNeedsBadge(); return; }
    if(e.target.closest("#pendCopy")){ copyPending(); return; }
    if(e.target.closest("#pendErase")){
      if(pending.length && confirm("Erase all captured needs? This only clears this phone's list — your spreadsheet isn't affected.")){
        pending = []; savePending(); renderPending(); updateNeedsBadge();
      }
      return;
    }
    // stats toggle
    if(e.target.closest(".statstoggle")){
      statsOpen = !statsOpen;
      const b = $("#statsbox"); if(b) b.classList.toggle("open", statsOpen);
      return;
    }
    // card expand/collapse
    const h = e.target.closest(".ghead");
    if(h) h.closest(".group").classList.toggle("open");
  });
  $("main").addEventListener("keydown", e => {
    if(e.target.id === "capName" && e.key === "Enter"){ e.preventDefault(); capture(); }
  });
  $("main").addEventListener("change", e => {
    if(e.target.id === "jpToggle"){ importJp = e.target.checked; saveImportJp(); renderImportResults(); }
    if(e.target.id === "proxyToggle"){ importProxy = e.target.checked; saveImportProxy(); renderImportResults(); }
  });
  $("#q").addEventListener("input", onSearch);
  $("#clr").addEventListener("click", () => { $("#q").value=""; onSearch(); focusSearch(); });
  $("#tab-search").addEventListener("click", () => setTab("search"));
  $("#tab-collection").addEventListener("click", () => setTab("collection"));
  $("#tab-needs").addEventListener("click", () => setTab("needs"));
  $("#tab-import").addEventListener("click", () => setTab("import"));
  $("#tab-notes").addEventListener("click", () => setTab("notes"));
  render();
  focusSearch();
  setHeadH();
}
window.addEventListener("resize", setHeadH);
window.addEventListener("orientationchange", setHeadH);
init();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
